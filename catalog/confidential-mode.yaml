# Catalog entry to copy into NousResearch/hermes-agent as plugin-catalog/<name>.yaml.
# The catalog slug appears once, on the next line; it is final and equal to plugin.yaml `name:`.
# The prose name is Hermes Confidential Mode.
name: confidential-mode
repo: https://github.com/ainsleys/hermes-confidential-mode
sha: "<40-char sha at submission>"   # filled in at submission: the entry cannot name the commit that contains it
description: >-
  Hermes Confidential Mode makes a confidential-compute provider checkable. It verifies the Tinfoil or
  NEAR AI Cloud enclave, pins the build you approve, keeps every model call and fallback inside the tier
  you lock (attested enclaves, or this machine only), encrypts what leaves, asks before a tool sends the
  conversation off the machine, and logs every call so you can render a receipt anyone can replay
  offline. The attested tier needs TINFOIL_API_KEY or NEAR_AI_API_KEY; shell and code execution are not
  inspected, a stray side call is recorded rather than stopped, and a receipt is a self-report beyond its
  signed evidence. Disclosure: docs/DISCLOSURE.md.
maintainer: ainsleys
tier: community
category: models
requires_hermes: ">=0.22.7"
docs_url: https://github.com/ainsleys/hermes-confidential-mode#readme   # placeholder: confirm at submission
version: "0.1.0"
known_issues:
  - "Auxiliary calls (compression, titles, vision and other side jobs) bypass the llm_execution middleware, so the plugin refuses to lock while one is routed off-tier and records a breach if one strays; it cannot stop the call."
  - "Hermes' CLI approve directive grants on any answer except 'deny'; the plugin's tool_execution middleware runs a tool only on an exact once, session or always."
  - "terminal, execute_code, process_manage and MCP servers launched as a command run on this host while locked, can reach the network, and are not inspected."
  - "Locked mode is refused unless Hermes' terminal backend is local, and while Hermes holds a cached terminal environment on any other backend, Docker included."
  - "Locked mode does not apply in safe-worker mode, where Hermes loads no plugins."
  - "Every plugin in the same process shares the trust boundary; under plugins.isolation: host the attested provider is invisible and the lock is refused."
  - "Tinfoil attests its router, not the model backend behind it; the report carries no client nonce, and every recorded time is the host clock."
  - "AMD and Intel routers have different enclave fingerprints, so a restart can ask for a new pin; set confidential.tinfoil.enclave to one router to stop this."
  - "An 'always' tool grant lives in Hermes' command_allowlist and outlives the lock until /confidential revoke <tool>."
  - "After a runtime switch to a hosted provider, Hermes' start-up model-list request goes out with your API key (no conversation text) before any plugin seam runs; the plugin then refuses the turn."
  - "If Hermes runs on someone else's machine, that operator sees every prompt; locked mode protects the road out of the Hermes process, not the process."
  - "hermes confidential replay uses the evidence's own trust root and capture time unless you pass --trusted-root and --as-of, and the first pin is trust on first use."
  - "There is no mixed 'attested or on-host' tier yet, so side jobs cannot run on an on-host model while the main model is attested."
  - "NEAR AI Cloud: streaming is refused, images reach NEAR's gateway in plaintext, the gateway reads model id, parameters, headers, sizes and timing, and instances share one key (docs/LIMITATIONS.md section 14)."
  - "An agent with terminal access on the same host can reach a pin approval prompt by some routes; the ledger records every approval with its surface (docs/LIMITATIONS.md section 15)."
capabilities:
  provides_tools: []
  provides_hooks:
    - pre_tool_call
    - post_approval_response
    - pre_llm_call
    - pre_api_request
    - pre_auxiliary_call
    - post_auxiliary_call
    - on_session_start
    - on_session_end
    - post_compaction
    - pre_gateway_dispatch
    - transform_llm_output
  provides_middleware:
    - llm_execution
    - tool_execution
  requires_env:
    - TINFOIL_API_KEY
