# Runs the plugin's test suite inside a Hermes checkout at the pinned commit, as docs/RUNNING_TESTS.md
# describes, and validates the plugin with Hermes' own validator. No secrets are used: TINFOIL_API_KEY and
# NEAR_AI_API_KEY are unset, so tests/live is skipped (and excluded) and no test contacts a vendor.
#
# Network: the install steps need PyPI (Hermes' locked dependencies and the plugin's), GitHub (both
# checkouts) and uv's Python downloads. The test run itself needs none: tests/conftest.py sets
# CONFIDENTIAL_MODE_NO_FETCH=1, vendor traffic is served by httpx.MockTransport worlds, and importing the
# tinfoil SDK makes no network call.
#
# Python versions. Hermes 84a0301 declares requires-python >=3.11, but its uv.lock covers only 3.14
# ([tool.uv] environments = ["python_version >= '3.14'"]) and every core dependency carries the marker
# python_version >= '3.14', so `uv sync` refuses 3.11 to 3.13 ("not compatible with the lockfile's
# supported environments"). On 3.14 the job runs `uv sync --frozen`. On 3.11 to 3.13 the job exports the
# same lock, drops only the ">= 3.14" clause from each marker, and installs exactly those pinned versions
# with --no-deps, then Hermes itself (editable, --no-deps). The plugin's own pins (tinfoil==0.14.2,
# pynacl==1.6.*, sigstore>=4.5,<4.6 and every other pin there) are installed from pyproject.toml on every
# version.
#
# Checkout path. The plugin is checked out as a directory named hermes-confidential-mode, as in
# docs/RUNNING_TESTS.md. The repository root has an __init__.py, so under a directory name that is a valid
# Python identifier (`plugin`, say) pytest imports the test modules as `<name>.tests...`, and the NEAR
# tests that patch tests.near_world fail. A name with a hyphen avoids that.
#
# Verified locally on 2026-11-08 (macOS arm64, uv 0.13.7), with the steps below run by hand in fresh
# virtual environments and HERMES_HOME set to a new temporary directory, no vendor key set:
#   - Python 3.14.6, `uv sync --frozen` path: 2926 passed, 6 xfailed.
#   - Python 3.13.5 and 3.12.16, export path: 2926 passed, 6 xfailed each.
#   - Python 3.11.18, export path: 2921 passed, 5 skipped (the 3.12-only f-string checks in
#     tests/unit/test_python311_syntax.py), 6 xfailed; `hermes plugins validate` ("Validation passed")
#     and `python -m compileall`.
#   - Python 3.14.6 under a macOS sandbox that denied every outbound connection except loopback: the same
#     2926 passed, so the test run needs no network.
# The workflow runs on ubuntu-latest; GitHub Actions itself was not run.

name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  HERMES_REPOSITORY: NousResearch/hermes-agent
  HERMES_SHA: 84a0301415edd6d1385207ec96e4d7f2b6c1fcd9
  UV_VERSION: "0.13.7"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  suite:
    name: suite (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out the plugin
        uses: actions/checkout@v4
        with:
          path: hermes-confidential-mode

      - name: Check out Hermes at the pinned commit
        uses: actions/checkout@v4
        with:
          repository: ${{ env.HERMES_REPOSITORY }}
          ref: ${{ env.HERMES_SHA }}
          path: hermes-agent

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}

      - name: Install Python ${{ matrix.python }}
        run: uv python install ${{ matrix.python }}

      - name: Install Hermes' locked dependencies (Python 3.14, uv sync)
        if: matrix.python == '3.14'
        working-directory: hermes-agent
        env:
          UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/venv
        run: uv sync --frozen --python ${{ matrix.python }}

      - name: Install Hermes' locked dependencies (Python 3.11 to 3.13, from the exported lock)
        if: matrix.python != '3.14'
        working-directory: hermes-agent
        run: |
          uv export --frozen --no-hashes --no-emit-project --no-dev > "$RUNNER_TEMP/hermes-lock.txt"
          sed -E -e "s/python_full_version >= '3\.14' and //" \
                 -e "s/ ; python_full_version >= '3\.14'\$//" \
                 "$RUNNER_TEMP/hermes-lock.txt" > "$RUNNER_TEMP/hermes-requirements.txt"
          uv venv --python ${{ matrix.python }} "$GITHUB_WORKSPACE/venv"
          uv pip install --python "$GITHUB_WORKSPACE/venv/bin/python" --no-deps \
            -r "$RUNNER_TEMP/hermes-requirements.txt"
          uv pip install --python "$GITHUB_WORKSPACE/venv/bin/python" --no-deps -e .

      - name: Install the plugin's dependencies and pytest
        run: |
          uv pip install --python venv/bin/python -r hermes-confidential-mode/pyproject.toml
          uv pip install --python venv/bin/python pytest==9.1.1 pytest-asyncio==1.4.0
          venv/bin/python -c "import cryptography.x509, nacl, sigstore, tinfoil, hermes_cli; print('imports ok')"

      - name: Run the suite (tests/spikes and tests/live excluded)
        working-directory: hermes-agent
        run: |
          export HERMES_HOME="$(mktemp -d)"
          export HERMES_AGENT_ROOT="$GITHUB_WORKSPACE/hermes-agent"
          unset TINFOIL_API_KEY NEAR_AI_API_KEY OPENROUTER_API_KEY NOUS_API_KEY
          PLUGIN="$GITHUB_WORKSPACE/hermes-confidential-mode"
          "$GITHUB_WORKSPACE/venv/bin/python" -m pytest "$PLUGIN/tests" \
            --ignore="$PLUGIN/tests/spikes" --ignore="$PLUGIN/tests/live" \
            -q -p no:cacheprovider

  validate:
    name: validate and compile (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the plugin
        uses: actions/checkout@v4
        with:
          path: hermes-confidential-mode

      - name: Check out Hermes at the pinned commit
        uses: actions/checkout@v4
        with:
          repository: ${{ env.HERMES_REPOSITORY }}
          ref: ${{ env.HERMES_SHA }}
          path: hermes-agent

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}

      - name: Install Python 3.11
        run: uv python install 3.11

      - name: Install Hermes and the plugin's dependencies (from the exported lock)
        working-directory: hermes-agent
        run: |
          uv export --frozen --no-hashes --no-emit-project --no-dev > "$RUNNER_TEMP/hermes-lock.txt"
          sed -E -e "s/python_full_version >= '3\.14' and //" \
                 -e "s/ ; python_full_version >= '3\.14'\$//" \
                 "$RUNNER_TEMP/hermes-lock.txt" > "$RUNNER_TEMP/hermes-requirements.txt"
          uv venv --python 3.11 "$GITHUB_WORKSPACE/venv"
          uv pip install --python "$GITHUB_WORKSPACE/venv/bin/python" --no-deps \
            -r "$RUNNER_TEMP/hermes-requirements.txt"
          uv pip install --python "$GITHUB_WORKSPACE/venv/bin/python" --no-deps -e .
          uv pip install --python "$GITHUB_WORKSPACE/venv/bin/python" \
            -r "$GITHUB_WORKSPACE/hermes-confidential-mode/pyproject.toml"

      - name: hermes plugins validate
        run: |
          export HERMES_HOME="$(mktemp -d)"
          venv/bin/hermes plugins validate "$GITHUB_WORKSPACE/hermes-confidential-mode"

      - name: Compile every source file on Python 3.11
        run: |
          venv/bin/python -m compileall -q hermes-confidential-mode/__init__.py \
            hermes-confidential-mode/confidential_mode hermes-confidential-mode/scripts
