name: confidential-mode
version: 0.1.0
description: "Hermes Confidential Mode makes a confidential-compute provider checkable. It verifies the Tinfoil or NEAR AI Cloud enclave, pins the build you approve, keeps every model call and fallback inside the tier you lock (attested enclaves, or this machine only), encrypts what leaves, asks before a tool sends the conversation off the machine, and logs every call so you can render a receipt anyone can replay offline. The attested tier needs TINFOIL_API_KEY or NEAR_AI_API_KEY; shell and code execution are not inspected, a stray side call is recorded rather than stopped, and a receipt is a self-report beyond its signed evidence. Disclosure: docs/DISCLOSURE.md."
homepage: https://github.com/ainsleys/hermes-confidential-mode#readme
author: ainsleys
kind: standalone
requires_hermes: ">=0.22.7"
requires_env:
  - TINFOIL_API_KEY
# Needed only for the attested-near provider; most installs use one vendor (docs/DISCLOSURE.md, Credentials).
optional_env:
  - name: NEAR_AI_API_KEY
    description: "NEAR AI Cloud API key, for the attested-near provider only"
provides_tools: []
provides_hooks:
  - pre_tool_call
  - post_approval_response
  - pre_llm_call
  - pre_api_request
  - pre_auxiliary_call
  - post_auxiliary_call
  - on_session_start
  - on_session_end
  - post_compaction
  - pre_gateway_dispatch
  - transform_llm_output
provides_middleware:
  - llm_execution
  - tool_execution
