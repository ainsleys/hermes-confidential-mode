name: confidential-mode
version: 0.1.0
description: "Seal a profile to local-only or attested (Tinfoil enclave) inference: refuses off-tier model calls and fallbacks, asks before off-machine tool calls (an always answer persists until removed from command_allowlist), refuses to seal while auxiliary, vision, memory or MCP routes leave the tier, pins the enclave measurement fingerprint you approved, and ledgers every send locally (watch view, receipts). Disclosure: docs/DISCLOSURE.md."
homepage: https://github.com/ainsleys/hermes-confidential-mode#readme
author: ainsleys
kind: standalone
requires_hermes: ">=0.22.7"
requires_env:
  - TINFOIL_API_KEY
provides_tools: []
provides_hooks:
  - pre_tool_call
  - post_approval_response
  - pre_llm_call
  - pre_api_request
  - pre_auxiliary_call
  - post_auxiliary_call
  - on_session_start
  - on_session_end
  - post_compaction
  - pre_gateway_dispatch
provides_middleware:
  - llm_execution
  - tool_execution
