name: confidential-mode
version: 0.1.0
description: "Seals a Hermes profile so that the model runs only on a local or private-range host, or in a Tinfoil enclave whose build you approved. While sealed, the plugin refuses off-tier model calls and fallbacks before they are sent. It asks you before each tool call that would send data off the machine. An 'always' answer lasts until you remove it from Hermes' command_allowlist. The plugin refuses to seal while any auxiliary, vision, memory or MCP route would leave the tier. It pins the enclave fingerprints you approved and refuses a build that does not match them. It records every send in a local ledger, which you can watch live or render as a receipt. Disclosure: docs/DISCLOSURE.md."
homepage: https://github.com/ainsleys/hermes-confidential-mode#readme
author: ainsleys
kind: standalone
requires_hermes: ">=0.22.7"
requires_env:
  - TINFOIL_API_KEY
provides_tools: []
provides_hooks:
  - pre_tool_call
  - post_approval_response
  - pre_llm_call
  - pre_api_request
  - pre_auxiliary_call
  - post_auxiliary_call
  - on_session_start
  - on_session_end
  - post_compaction
  - pre_gateway_dispatch
provides_middleware:
  - llm_execution
  - tool_execution
