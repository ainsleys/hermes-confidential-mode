name: confidential-mode
version: 0.1.0
description: "Hermes Confidential Mode locks a Hermes profile to one tier: attested (a Tinfoil enclave, or NEAR AI Cloud's gateway and models, verified and pinned to a build you approve) or on-host-only (loopback and hosts you list). While locked, the plugin refuses off-tier main model calls before they are sent; refuses to lock while a side call, fallback, memory, MCP URL or delegation route would leave the tier; on the attested tier encrypts request bodies to the verified enclave or model key, with headers, sizes and NEAR images still visible; and asks before each off-host tool call, blocking it when nobody can answer. The plugin logs each model call's host and size, never its text, and renders a receipt whose attached enclave evidence replays offline; the rest of the receipt is the plugin's own record. The attested tier needs TINFOIL_API_KEY or NEAR_AI_API_KEY. Shell and code execution are not inspected for network access, and a side call that strays mid-turn is recorded, not stopped. Disclosure: the plugin contacts the vendor (atc.tinfoil.sh, the Tinfoil router and the *.tinfoil.sh collateral proxies, or cloud-api.near.ai), Intel Trust Authority (portal and portal.eu), Sigstore's TUF CDN, and GitHub (raw.githubusercontent.com, api.github.com) for NEAR compose files, also in the background after a verification stages a NEAR entry; the plugin sends no telemetry. The plugin writes under <HERMES_HOME>/plugin-data/ (including the ledger, evidence blobs, pins.yaml, allowlist.yaml, state and SDK caches), Hermes' tool-discovery cache on a terminal lock, and, on a revoke only, its own command_allowlist entries in config.yaml; the plugin reads config.yaml, auth.json (presence only, a known issue) and script files a locked tool call runs. The plugin reads TINFOIL_API_KEY, NEAR_AI_API_KEY, TERMINAL_ENV, TERMINAL_CWD, HERMES_HOME, CONFIDENTIAL_MODE_PROGRESS and CONFIDENTIAL_MODE_NO_FETCH, sets XDG_CONFIDENTIAL_MODE_TOOL_PROCESS, stores no credential, runs no shell command or subprocess, and keeps one re-verification thread per attested provider while locked. hermes plugins validate counts 30 private core import sites (docs/DISCLOSURE.md)."
homepage: https://github.com/ainsleys/hermes-confidential-mode#readme
author: ainsleys
kind: standalone
requires_hermes: ">=0.22.7"
requires_env:
  - TINFOIL_API_KEY
# Needed only for the attested-near provider; most installs use one vendor (docs/DISCLOSURE.md, Credentials).
optional_env:
  - name: NEAR_AI_API_KEY
    description: "NEAR AI Cloud API key, for the attested-near provider only"
provides_tools: []
provides_hooks:
  - pre_tool_call
  - post_approval_response
  - pre_llm_call
  - pre_api_request
  - pre_auxiliary_call
  - post_auxiliary_call
  - on_session_start
  - on_session_end
  - post_compaction
  - pre_gateway_dispatch
  - transform_llm_output
provides_middleware:
  - llm_execution
  - tool_execution
