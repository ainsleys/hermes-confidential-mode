[project]
name = "hermes-confidential-mode"
version = "0.1.0"
description = "Attested inference provider and locked mode for Hermes Agent"
requires-python = ">=3.11"
# SPDX expression (PEP 639), the form Hermes' own pyproject.toml uses.
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    # Exact: 0.15.0 requires openai>=3.26 and Hermes pins openai 2.54.0.
    "tinfoil==0.14.2",
    # Provided by Hermes' own environment (httpx 0.28.1; hermes_yaml stands in for PyYAML there). Bounded
    # because the NEAR adapter reads httpx internals (httpx._decoders, Response._content).
    "httpx>=0.28,<0.29",
    # Imported directly by the plugin (review finding 26). tinfoil 0.14.2 already requires each of these;
    # they are declared so a resolver sees them. Each has an upper bound (catalog rule 10): the next major
    # above what Hermes 84a0301's uv.lock resolves (cryptography 50.0.2, openai 2.54.0, requests 2.34.2,
    # urllib3 2.8.0), and for pyopenssl, which Hermes does not lock, the next major above the 26.4.0 tested.
    # sigstore is bounded because _sdkpatch.py and verify/tinfoil.py wrap sigstore._internal.tuf, which is
    # private and changes between minor versions.
    "cryptography>=42,<51",
    "openai>=1.63,<3",
    "requests>=2.31,<3",
    "urllib3>=2.8,<3",
    "pyopenssl>=25,<27",
    "sigstore>=4.5,<4.6",
    # NEAR request encryption (verify/near_e2ee.py): Ed25519 to X25519 and XChaCha20-Poly1305 (libsodium).
    # Hermes' uv.lock already pins pynacl >=1.6,<1.7 as an override; installed by hand (docs/RUNNING_TESTS.md).
    "pynacl==1.6.*",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff==0.17.4", "mypy==2.4.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
# The code is written to about 115 columns; 120 is the nearest limit that leaves it as it is.
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    # Tier, Origin and Route subclass (str, Enum). StrEnum changes str() and format() of each member,
    # and receipts, the ledger and status text print them.
    "UP042",
]

[tool.ruff.lint.per-file-ignores]
# Tests import pytest fixtures by name from shared harness modules and take them as parameters, which
# ruff reads as a redefinition of the import.
"tests/**" = [
    "F811",
    # Assertions keep the exact user-facing sentence, and fixtures keep captured hex values, whole on one
    # line, so a search for the text finds the test.
    "E501",
    # Fault and hostile tests assert that a step refuses or fails, not which exception class it raises.
    "B017",
]
# One import statement per private Hermes name, so each is one site in `hermes plugins validate`
# (INTERFACES Amendment 15).
"confidential_mode/hermes_compat.py" = ["I001"]

[tool.ruff.lint.isort]
known-first-party = ["confidential_mode"]
# Keep the existing wrapped style: several names per line, aliases beside the other names.
split-on-trailing-comma = false
combine-as-imports = true

[tool.mypy]
python_version = "3.11"
files = ["confidential_mode", "scripts"]
# The repository root is itself a package (the plugin's register(ctx)); its directory name is not an
# identifier, so module names are taken from the root instead of from the parent directory.
explicit_package_bases = true
mypy_path = "."
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
# Hermes is installed as an editable import hook that mypy cannot follow; the vendor SDKs ship no types.
module = [
    "hermes_cli.*", "agent.*", "tools.*", "providers.*", "providers", "plugins.*", "gateway.*",
    "hermes_yaml", "hermes_constants", "tinfoil.*", "tinfoil_ehbp.*", "sigstore.*", "sigstore_models.*",
    "nacl.*", "yaml", "OpenSSL.*",
]
ignore_missing_imports = true
