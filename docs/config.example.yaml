# PLUGIN_NAME: confidential-mode  (working name; the config section below is `confidential:` either way)
#
# This is an example fragment of ~/.hermes/config.yaml for the attested tier. The attested tier
# allows the model to run only in Tinfoil's verified enclave, or behind NEAR AI Cloud's verified
# gateway (confidential.near below; `hermes confidential setup --vendor near` prints a NEAR block).
#
# Merge this fragment into your own config by hand. The plugin never writes your config.
#
# Two commands help with the merge:
#   - `hermes confidential setup --model <id>` prints the auxiliary block that matches your Hermes
#     version.
#   - `hermes confidential check --tier attested` runs the preflight and tells you what still fails.
#     The preflight is the check the plugin runs over your config before it will lock a profile.
#
# The model ids below are Tinfoil's (https://docs.tinfoil.sh/models/chat.md, read 2026-11-06). This
# example uses kimi-k3-1-pro because that model accepts images. Vision can therefore stay on the same
# model as everything else.

# ── Plugin keys (every key the code reads) ────────────────────────────────────────────────────
confidential:
  # The model id that `hermes confidential setup` writes into the config block it prints.
  # Only setup reads this key.
  model: kimi-k3-1-pro

  # How many seconds one verification of the enclave stays valid. After that, the next send verifies
  # the enclave again before it goes out. The time is measured on a monotonic clock, which does not
  # jump when the system time changes. Default 300.
  verify_ttl_seconds: 300

  # How many seconds a turn waits for a verification to finish. If the verification is not done in
  # time, the turn is refused with "attestation still in progress; this turn ended; resend". The
  # verification keeps running in the background, so the next attempt usually succeeds. Default 20.
  verify_wait_seconds: 20

  pins:
    # A pin is your recorded approval of one router build. When this is true, the plugin applies a
    # new pin without asking you, but only when all three of these hold:
    #   - you already have a pin;
    #   - the code fingerprint is unchanged, so only the platform (AMD or Intel) changed;
    #   - the SDK's signed hardware-measurements check passed.
    # In tinfoil 0.14.2 that check runs only for Intel TDX routers. Only a switch to a TDX router can
    # therefore be approved this way. Only the exact value true turns this on. Default false.
    auto_approve_platform_only: false

  tinfoil:
    # One router host to verify and use. The router is the Tinfoil enclave your requests connect to.
    #
    # When this is unset (null, the default), the SDK discovers routers through atc.tinfoil.sh and
    # picks one at random, once per process.
    #
    # AMD and Intel routers have different enclave fingerprints for the same release. After a
    # restart, discovery may therefore pick a router on the other platform, and the plugin then asks
    # you to approve the pin again. Setting this key stops that.
    #
    # Example value: <router host>.tinfoil.sh
    enclave: null

    # The context window the plugin reports to Hermes for the attested provider. Because the plugin
    # reports it, Hermes never sends its own /models or /api/show probe, which would go outside the
    # attested transport.
    #
    # This is one value for the whole profile, not one per model. Set it for the model named in
    # model.default, at or below the window Tinfoil documents for that model. Default 65536.
    #
    # Tinfoil documents these windows. They are rounded, because Tinfoil publishes no exact integers.
    #   kimi-k3-1-pro        256K  -> 256000   (text and image input)
    #   glm-5-3              1M    -> 1000000  (reasoning tokens count toward max_tokens)
    #   deepseek-v4-1-flash  1M    -> 1000000  (image input; marked experimental)
    #   gemma4-31b           256K  -> 256000   (image input)
    #   gpt-oss-120b         131K  -> 131000
    #   llama3-3-70b         128K  -> 128000
    #
    # A value lower than the documented window is safe. Hermes then compresses context earlier. A
    # higher value is not safe.
    context_length: 256000

  near:
    # NEAR AI Cloud, the second attested vendor (provider attested-near). These keys matter only when
    # model.provider or an auxiliary task uses attested-near. README: "The attested tier with NEAR AI".
    #
    # The gateway URL. Attestation, inference and signature requests all go here. Default:
    base_url: https://cloud-api.near.ai/v1

    # Every NEAR model id Hermes may send. The plugin adds the ids that model.default and
    # auxiliary.<task>.model name for attested-near. A request for any other model is refused before it
    # is sent, while require_provider_tee is true. The pin covers exactly this list. Use full ids (NEAR
    # signs the id it received). Default [].
    models: [Qwen/Qwen3.8-27B]

    # true: a send counts as verified only with a provider_tee signature, made by an attested model
    # server's key over "<model id>:<request sha256>:<response sha256>". A gateway-kind or missing
    # signature is recorded as unverified, and the receipt says the session is not fully attested.
    # false: a verified gateway signature is enough, and models with no model attestation
    # (NEAR's Incognito models) are allowed. Only the exact value false turns this off. Default true.
    require_provider_tee: true

    # true: the TLS certificate of the attestation connection must be the one the gateway's report
    # binds. Default true.
    require_tls_binding: true

    # Intel TCB status values accepted for the gateway, from Intel Trust Authority's token.
    # Default [UpToDate].
    accepted_tcb_statuses: [UpToDate]

    # How many seconds the plugin keeps asking for a response's signature after the response ended
    # (NEAR may record it a moment later). The turn waits at most this long. Default 5.
    signature_wait_seconds: 5

    # false: Hermes sends main calls unstreamed. NEAR's gateway re-signs streamed responses with its
    # own key, so only unstreamed responses can carry a provider_tee signature. Default false.
    streaming: false

    # The context window reported to Hermes for attested-near (no /models probe). Default 65536.
    context_length: 65536

  on_host:
    # Extra hostnames or IP addresses that the on-host-only tier counts as on-host.
    #
    # Without this list, the on-host-only tier accepts loopback addresses, the RFC 1918 private ranges,
    # 100.64/10, fe80::/10, fc00::/7 and localhost. The plugin never looks a hostname up in DNS, so
    # any other hostname is off-tier unless it is listed here. Default [].
    extra_hosts: []

# ── Core keys the attested preflight checks ───────────────────────────────────────────────────
model:
  provider: attested-tinfoil       # This provider is registered by the plugin.
  default: kimi-k3-1-pro           # Hermes also accepts model.model as another name for this key.
  # base_url: leave it unset. A base_url whose host differs from the attested enclave is off-tier.

fallback_providers: []             # Must be empty while locked.
# fallback_model:                  # Older key for the same purpose. Must be absent or empty.

auxiliary:
  # Auxiliary tasks are the side jobs Hermes runs with a model, such as compression and titles.
  #
  # Vision must be set explicitly, and to an in-tier route. Hermes describes images that arrive
  # through the gateway with the vision task, even when no tool is called. Its "auto" route also
  # tries openrouter, then nous, then deepinfra when the main model cannot take images.
  vision:            {provider: attested-tinfoil, model: kimi-k3-1-pro}
  # Text tasks set to "auto" (the default) or "main" inherit the main route, so they pass. Setting
  # them explicitly, as below, keeps a later change of model.provider from moving them silently.
  compression:          {provider: attested-tinfoil, model: kimi-k3-1-pro}
  approval:             {provider: attested-tinfoil, model: kimi-k3-1-pro}
  review:               {provider: attested-tinfoil, model: kimi-k3-1-pro}
  mcp:                  {provider: attested-tinfoil, model: kimi-k3-1-pro}
  title_generation:     {provider: attested-tinfoil, model: kimi-k3-1-pro}
  memory_query_rewrite: {provider: attested-tinfoil, model: kimi-k3-1-pro}
  tts_audio_tags:       {provider: attested-tinfoil, model: kimi-k3-1-pro}
  voice_chat:           {provider: attested-tinfoil, model: kimi-k3-1-pro}
  triage_specifier:     {provider: attested-tinfoil, model: kimi-k3-1-pro}
  kanban_decomposer:    {provider: attested-tinfoil, model: kimi-k3-1-pro}
  profile_describer:    {provider: attested-tinfoil, model: kimi-k3-1-pro}
  goal_judge:           {provider: attested-tinfoil, model: kimi-k3-1-pro}
  group_router:         {provider: attested-tinfoil, model: kimi-k3-1-pro}
  curator:              {provider: attested-tinfoil, model: kimi-k3-1-pro}
  monitor:              {provider: attested-tinfoil, model: kimi-k3-1-pro}
  background_review:    {provider: attested-tinfoil, model: kimi-k3-1-pro}
  # moa_reference and moa_aggregator: leave them unset, so they inherit the main route. The preflight
  # refuses "moa" as a provider.
  # A fallback_chain under any task must be empty, or must contain only in-tier routes.
  # Auxiliary tasks registered by other plugins are checked as well.

memory:
  # Use the built-in on-host memory. The values "", builtin, local and none all mean that. A hosted
  # memory provider is off-tier.
  provider: ""

delegation: {}                     # Leave provider and base_url unset, so child agents inherit the locked route.

voice:
  # Keep this false. When it is true and tts.provider is unset, Hermes speaks replies through edge,
  # which is a hosted service.
  auto_tts: false

# tts:
#   provider: piper                # On-host engines pass: piper, kittentts, neutts, or a providers.<name> command.

# mcp_servers:
#   # A server configured with a URL must point at an in-tier host, or set enabled: false.
#   # A server launched with a command passes. The plugin does not inspect what that command does.
#   notes: {command: ...}

plugins:
  # Keep Hermes' default. Under host isolation, the attested provider is invisible to Hermes, and the
  # preflight refuses to lock.
  isolation: in_process
  # hook_callback_timeout: leave it unset, or set it to 5 seconds or more. A shorter timeout lets
  #   Hermes skip the plugin's per-turn check. Every plugins.* key that governs hooks is part of the
  #   lock fingerprint, so changing one after locking blocks every turn until you lock again.
