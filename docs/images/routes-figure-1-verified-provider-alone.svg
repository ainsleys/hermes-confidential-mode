<svg xmlns="http://www.w3.org/2000/svg" font-family="IBM Plex Sans, Helvetica Neue, Arial, sans-serif" viewBox="0 60 900 436" role="img" aria-label="Six arrows leave a Hermes profile. Only the main chat arrow reaches a verified enclave. Side calls, fallback, tools, shell and code, and memory reach hosts nobody checks.">
      <style>
        svg { color: #1f2320; }
        .muted { opacity: 0.72; }
        .ok-s { stroke: #1f7a4d; } .ok-f { fill: #1f7a4d; }
        .open-s { stroke: #b4541a; } .open-f { fill: #b4541a; }
        @media (prefers-color-scheme: dark) {
          svg { color: #e6edf3; }
          .ok-s { stroke: #3fb950; } .ok-f { fill: #3fb950; }
          .open-s { stroke: #f0883e; } .open-f { fill: #f0883e; }
        }
      </style>
      <defs>
        <marker id="m1-locked" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="ok-f"/></marker>
        <marker id="m1-open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="open-f"/></marker>
      </defs>
      <!-- the profile -->
      <rect x="20" y="70" width="200" height="386" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
      <text x="120" y="100" text-anchor="middle" font-size="14" font-weight="600" fill="currentColor">Your Hermes profile</text>
      <text x="120" y="124" text-anchor="middle" font-size="12" fill="currentColor" class="muted">what it holds:</text>
      <text x="120" y="142" text-anchor="middle" font-size="12" fill="currentColor">messages you type</text>
      <text x="120" y="160" text-anchor="middle" font-size="12" fill="currentColor">files the agent reads</text>
      <text x="120" y="178" text-anchor="middle" font-size="12" fill="currentColor">tool results</text>
      <text x="120" y="196" text-anchor="middle" font-size="12" fill="currentColor">memory it keeps</text>

      <!-- row 1 · y=120 · main chat -->
      <line x1="220" y1="120" x2="566" y2="120" class="ok-s" stroke-width="1.6" marker-end="url(#m1-locked)"/>
      <text x="393" y="112" text-anchor="middle" font-size="12.5" fill="currentColor">main chat · the provider you picked</text>
      <rect x="570" y="94" width="310" height="52" rx="5" fill="none" class="ok-s" stroke-width="1.6"/>
      <text x="586" y="114" font-size="13" font-weight="600" fill="currentColor">Attested enclave (Tinfoil)</text>
      <text x="586" y="132" font-size="11.5" fill="currentColor" class="muted">a verification under 5 min old before each send</text>

      <!-- row 2 · y=182 · side calls -->
      <line x1="220" y1="182" x2="566" y2="182" class="open-s" stroke-width="1.6" marker-end="url(#m1-open)"/>
      <text x="393" y="174" text-anchor="middle" font-size="12.5" fill="currentColor">19+ kinds of side call</text>
      <text x="393" y="198" text-anchor="middle" font-size="11.5" fill="currentColor" class="muted">titles · compaction · memory rewrite · vision · review</text>
      <rect x="570" y="156" width="310" height="52" rx="5" fill="none" class="open-s" stroke-width="1.6"/>
      <text x="586" y="172" font-size="13" font-weight="600" fill="currentColor">Each task's own provider</text>
      <text x="586" y="188" font-size="11.5" fill="currentColor" class="muted">"auto" follows chat; vision, fallbacks or a pinned</text>
      <text x="586" y="202" font-size="11.5" fill="currentColor" class="muted">cheap model can go elsewhere · nothing checks</text>

      <!-- row 3 · y=244 · fallback -->
      <line x1="220" y1="244" x2="566" y2="244" class="open-s" stroke-width="1.6" marker-end="url(#m1-open)"/>
      <text x="393" y="236" text-anchor="middle" font-size="12.5" fill="currentColor">fallback · when the main request fails</text>
      <rect x="570" y="218" width="310" height="52" rx="5" fill="none" class="open-s" stroke-width="1.6"/>
      <text x="586" y="238" font-size="13" font-weight="600" fill="currentColor">Fallback provider</text>
      <text x="586" y="256" font-size="11.5" fill="currentColor" class="muted">takes over quietly · same text, different host</text>

      <!-- row 4 · y=306 · tools -->
      <line x1="220" y1="306" x2="566" y2="306" class="open-s" stroke-width="1.6" marker-end="url(#m1-open)"/>
      <text x="393" y="298" text-anchor="middle" font-size="12.5" fill="currentColor">tools · web fetch, messaging, browser</text>
      <rect x="570" y="280" width="310" height="52" rx="5" fill="none" class="open-s" stroke-width="1.6"/>
      <text x="586" y="300" font-size="13" font-weight="600" fill="currentColor">Any site the agent decides to call</text>
      <text x="586" y="318" font-size="11.5" fill="currentColor" class="muted">nothing asks · nothing records</text>

      <!-- row 5 · y=368 · shell and code -->
      <line x1="220" y1="368" x2="566" y2="368" class="open-s" stroke-width="1.6" marker-end="url(#m1-open)"/>
      <text x="393" y="360" text-anchor="middle" font-size="12.5" fill="currentColor">shell · code · MCP command servers</text>
      <rect x="570" y="342" width="310" height="52" rx="5" fill="none" class="open-s" stroke-width="1.6"/>
      <text x="586" y="362" font-size="13" font-weight="600" fill="currentColor">Run on this host, can reach the network</text>
      <text x="586" y="380" font-size="11.5" fill="currentColor" class="muted">Hermes asks only on shell or code it flags as dangerous</text>

      <!-- row 6 · y=430 · memory -->
      <line x1="220" y1="430" x2="566" y2="430" class="open-s" stroke-width="1.6" marker-end="url(#m1-open)"/>
      <text x="393" y="422" text-anchor="middle" font-size="12.5" fill="currentColor">memory · what the agent keeps</text>
      <rect x="570" y="404" width="310" height="52" rx="5" fill="none" class="open-s" stroke-width="1.6"/>
      <text x="586" y="424" font-size="13" font-weight="600" fill="currentColor">Whatever store is configured</text>
      <text x="586" y="442" font-size="11.5" fill="currentColor" class="muted">possibly off this host</text>

      <text x="450" y="484" text-anchor="middle" font-size="12.5" fill="currentColor" class="muted">One route verified. Five routes unchecked. Nothing records which were used.</text>
    </svg>
