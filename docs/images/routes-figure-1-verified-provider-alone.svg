<svg xmlns="http://www.w3.org/2000/svg" font-family="IBM Plex Sans, Helvetica Neue, Arial, sans-serif" viewBox="0 60 900 436" role="img" aria-label="Six arrows leave a Hermes profile. Only the main chat arrow reaches a verified enclave. Side calls, fallback, tools, shell and code, and memory reach hosts nobody checks.">
      <defs>
        <marker id="m1-locked" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f7a4d"/></marker>
        <marker id="m1-open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b4541a"/></marker>
      </defs><rect x="0" y="60" width="900" height="436" fill="#fbfaf7"/>
      <!-- the profile -->
      <rect x="20" y="70" width="200" height="386" rx="6" fill="#f1f0ea" stroke="#1f2320" stroke-width="1.2"/>
      <text x="120" y="100" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2320">Your Hermes profile</text>
      <text x="120" y="124" text-anchor="middle" font-size="12" fill="#5f655f">what it holds:</text>
      <text x="120" y="142" text-anchor="middle" font-size="12" fill="#1f2320">messages you type</text>
      <text x="120" y="160" text-anchor="middle" font-size="12" fill="#1f2320">files the agent reads</text>
      <text x="120" y="178" text-anchor="middle" font-size="12" fill="#1f2320">tool results</text>
      <text x="120" y="196" text-anchor="middle" font-size="12" fill="#1f2320">memory it keeps</text>

      <!-- row 1 · y=120 · main chat -->
      <line x1="220" y1="120" x2="566" y2="120" stroke="#1f7a4d" stroke-width="1.6" marker-end="url(#m1-locked)"/>
      <text x="393" y="112" text-anchor="middle" font-size="12.5" fill="#1f2320">main chat · the provider you picked</text>
      <rect x="570" y="94" width="310" height="52" rx="5" fill="#dff1e6" stroke="#1f7a4d" stroke-width="1.6"/>
      <text x="586" y="114" font-size="13" font-weight="600" fill="#1f2320">Attested enclave (Tinfoil)</text>
      <text x="586" y="132" font-size="11.5" fill="#5f655f">a verification under 5 min old before each send</text>

      <!-- row 2 · y=182 · side calls -->
      <line x1="220" y1="182" x2="566" y2="182" stroke="#b4541a" stroke-width="1.6" marker-end="url(#m1-open)"/>
      <text x="393" y="174" text-anchor="middle" font-size="12.5" fill="#1f2320">19+ kinds of side call</text>
      <text x="393" y="198" text-anchor="middle" font-size="11.5" fill="#5f655f">titles · compaction · memory rewrite · vision · review</text>
      <rect x="570" y="156" width="310" height="52" rx="5" fill="#fbe9dc" stroke="#b4541a" stroke-width="1.6"/>
      <text x="586" y="172" font-size="13" font-weight="600" fill="#1f2320">Each task's own provider</text>
      <text x="586" y="188" font-size="11.5" fill="#5f655f">"auto" follows chat; vision, fallbacks or a pinned</text>
      <text x="586" y="202" font-size="11.5" fill="#5f655f">cheap model can go elsewhere · nothing checks</text>

      <!-- row 3 · y=244 · fallback -->
      <line x1="220" y1="244" x2="566" y2="244" stroke="#b4541a" stroke-width="1.6" marker-end="url(#m1-open)"/>
      <text x="393" y="236" text-anchor="middle" font-size="12.5" fill="#1f2320">fallback · when the main request fails</text>
      <rect x="570" y="218" width="310" height="52" rx="5" fill="#fbe9dc" stroke="#b4541a" stroke-width="1.6"/>
      <text x="586" y="238" font-size="13" font-weight="600" fill="#1f2320">Fallback provider</text>
      <text x="586" y="256" font-size="11.5" fill="#5f655f">takes over quietly · same text, different host</text>

      <!-- row 4 · y=306 · tools -->
      <line x1="220" y1="306" x2="566" y2="306" stroke="#b4541a" stroke-width="1.6" marker-end="url(#m1-open)"/>
      <text x="393" y="298" text-anchor="middle" font-size="12.5" fill="#1f2320">tools · web fetch, messaging, browser</text>
      <rect x="570" y="280" width="310" height="52" rx="5" fill="#fbe9dc" stroke="#b4541a" stroke-width="1.6"/>
      <text x="586" y="300" font-size="13" font-weight="600" fill="#1f2320">Any site the agent decides to call</text>
      <text x="586" y="318" font-size="11.5" fill="#5f655f">nothing asks · nothing records</text>

      <!-- row 5 · y=368 · shell and code -->
      <line x1="220" y1="368" x2="566" y2="368" stroke="#b4541a" stroke-width="1.6" marker-end="url(#m1-open)"/>
      <text x="393" y="360" text-anchor="middle" font-size="12.5" fill="#1f2320">shell · code · MCP command servers</text>
      <rect x="570" y="342" width="310" height="52" rx="5" fill="#fbe9dc" stroke="#b4541a" stroke-width="1.6"/>
      <text x="586" y="362" font-size="13" font-weight="600" fill="#1f2320">Run on this host, can reach the network</text>
      <text x="586" y="380" font-size="11.5" fill="#5f655f">Hermes asks only on shell or code it flags as dangerous</text>

      <!-- row 6 · y=430 · memory -->
      <line x1="220" y1="430" x2="566" y2="430" stroke="#b4541a" stroke-width="1.6" marker-end="url(#m1-open)"/>
      <text x="393" y="422" text-anchor="middle" font-size="12.5" fill="#1f2320">memory · what the agent keeps</text>
      <rect x="570" y="404" width="310" height="52" rx="5" fill="#fbe9dc" stroke="#b4541a" stroke-width="1.6"/>
      <text x="586" y="424" font-size="13" font-weight="600" fill="#1f2320">Whatever store is configured</text>
      <text x="586" y="442" font-size="11.5" fill="#5f655f">possibly off this host</text>

      <text x="450" y="484" text-anchor="middle" font-size="12.5" fill="#5f655f">One route verified. Five routes unchecked. Nothing records which were used.</text>
    </svg>
