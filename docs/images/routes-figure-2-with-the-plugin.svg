<svg xmlns="http://www.w3.org/2000/svg" font-family="IBM Plex Sans, Helvetica Neue, Arial, sans-serif" viewBox="0 0 900 500" role="img" aria-label="Six routes leave a locked Hermes profile. A preflight, run at lock and before every turn, crosses five of them. Main chat and side calls go only to the verified enclave; a side call that strays mid-turn is recorded, not stopped. Fallback is refused and a failed request ends the turn. Tools not classed as on-host ask once per lock in each conversation and are blocked under yolo, approvals off and unattended runs. Memory must be the built-in store or none. Shell, code and command MCP servers stay open on this host and are listed as unproven in the receipt. Dots mark where ledger rows are written on this host.">
  <style>
    svg { color: #1f2320; }
    .muted { opacity: 0.72; }
    .open-s { stroke: #b4541a; }
    .open-f { fill: #b4541a; }
    @media (prefers-color-scheme: dark) {
      svg { color: #e6edf3; }
      .open-s { stroke: #f0883e; }
      .open-f { fill: #f0883e; }
    }
  </style>
  <defs>
    <marker id="b-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker>
    <marker id="b-open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="open-f"/></marker>
  </defs>

  <!-- the locked profile -->
  <rect x="20" y="76" width="160" height="372" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <text x="100" y="267" text-anchor="middle" font-size="14" font-weight="600" fill="currentColor">Locked profile</text>

  <!-- preflight: checks the configured routes at lock and before every turn; not shell, code or command MCP -->
  <line x1="250" y1="80" x2="250" y2="372" stroke="currentColor" stroke-width="2" stroke-dasharray="2 4" stroke-linecap="round"/>
  <text x="250" y="60" text-anchor="middle" font-size="12.5" font-weight="600" fill="currentColor">preflight · at lock, every turn</text>

  <!-- row 1 and 2 · main chat and side calls -> verified enclave -->
  <line x1="180" y1="104" x2="556" y2="104" stroke="currentColor" stroke-width="1.6" marker-end="url(#b-head)"/>
  <text x="380" y="96" text-anchor="middle" font-size="13" fill="currentColor">main chat</text>
  <line x1="180" y1="154" x2="556" y2="154" stroke="currentColor" stroke-width="1.6" marker-end="url(#b-head)"/>
  <text x="380" y="146" text-anchor="middle" font-size="13" fill="currentColor">side calls</text>
  <rect x="560" y="80" width="320" height="98" rx="5" fill="none" stroke="currentColor" stroke-width="1.6"/>
  <text x="576" y="124" font-size="13" font-weight="600" fill="currentColor">Verified enclave only</text>
  <text x="576" y="144" font-size="12" fill="currentColor" class="muted">a stray side call is recorded, not stopped</text>

  <!-- row 3 · fallback -> refused -->
  <line x1="180" y1="214" x2="556" y2="214" stroke="currentColor" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#b-head)"/>
  <text x="380" y="206" text-anchor="middle" font-size="13" fill="currentColor">fallback</text>
  <rect x="560" y="192" width="320" height="48" rx="5" fill="none" stroke="currentColor" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="576" y="212" font-size="13" font-weight="600" fill="currentColor">Refused</text>
  <text x="576" y="230" font-size="12" fill="currentColor" class="muted">a failed request ends the turn</text>

  <!-- row 4 · tools not classed as on-host -> ask once per lock -->
  <line x1="180" y1="276" x2="556" y2="276" stroke="currentColor" stroke-width="1.6" marker-end="url(#b-head)"/>
  <text x="380" y="268" text-anchor="middle" font-size="13" fill="currentColor">tools not classed as on-host</text>
  <rect x="560" y="254" width="320" height="64" rx="5" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <text x="576" y="274" font-size="13" font-weight="600" fill="currentColor">Ask once per lock</text>
  <text x="576" y="292" font-size="12" fill="currentColor" class="muted">in each conversation</text>
  <text x="576" y="308" font-size="12" fill="currentColor" class="muted">blocked under yolo, approvals off or unattended</text>

  <!-- row 5 · memory -> built-in store -->
  <line x1="180" y1="356" x2="556" y2="356" stroke="currentColor" stroke-width="1.6" marker-end="url(#b-head)"/>
  <text x="380" y="348" text-anchor="middle" font-size="13" fill="currentColor">memory</text>
  <rect x="560" y="332" width="320" height="48" rx="5" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <text x="576" y="361" font-size="13" font-weight="600" fill="currentColor">Built-in store or none</text>

  <!-- row 6 · shell, code, command MCP -> still open (accent) -->
  <line x1="180" y1="421" x2="556" y2="421" class="open-s" stroke-width="1.8" marker-end="url(#b-open)"/>
  <text x="380" y="413" text-anchor="middle" font-size="13" fill="currentColor">shell · code · command MCP</text>
  <rect x="560" y="394" width="320" height="54" rx="5" fill="none" class="open-s" stroke-width="1.8"/>
  <text x="576" y="416" font-size="13" font-weight="600" fill="currentColor">Open on this host</text>
  <text x="576" y="434" font-size="12" fill="currentColor" class="muted">reaches the network · unproven</text>

  <!-- ledger rows on this host -->
  <circle cx="500" cy="104" r="4" fill="currentColor"/>
  <circle cx="500" cy="154" r="4" fill="currentColor"/>
  <circle cx="500" cy="214" r="4" fill="currentColor"/>
  <circle cx="500" cy="276" r="4" fill="currentColor"/>
  <circle cx="186" cy="478" r="4" fill="currentColor"/>
  <text x="198" y="482" font-size="12.5" fill="currentColor">ledger row on this host</text>
</svg>
