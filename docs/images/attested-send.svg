<svg xmlns="http://www.w3.org/2000/svg" font-family="IBM Plex Sans, Helvetica Neue, Arial, sans-serif" viewBox="0 0 1000 404" role="img" aria-label="One model call on the attested tier, in six steps from left to right. 1: the enclave's attestation report is fetched over an unpinned connection, checked by its signatures and verified on this host against the build you approved. 2: the connection is pinned to the report's TLS key before any byte, headers and API key included, is sent; on NEAR the pinned connection ends at the attested gateway. 3: the text leaves as ciphertext; Tinfoil encrypts the whole body through the vendor's transport. 4: the reply comes back and, on NEAR, its signature is checked before release. 5: a ledger row is written on this host with the size and never the text. 6: a receipt is rendered that anyone can replay offline. A note on the gateway lane, which exists on NEAR only, says the gateway is attested and pinned, that TLS and the API key end there, and that it reads images, the model id, settings, headers, sizes and timing.">
  <style>
    svg { color: #1f2320; }
    .muted { opacity: 0.72; }
    @media (prefers-color-scheme: dark) { svg { color: #e6edf3; } }
  </style>
  <defs>
    <marker id="a-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker>
  </defs>

  <!-- lanes -->
  <rect x="20" y="42" width="960" height="48" rx="6" fill="none" stroke="currentColor" stroke-width="1.6"/>
  <text x="964" y="72" text-anchor="end" font-size="14" fill="currentColor"><tspan font-weight="600">Enclave</tspan><tspan class="muted"> · build you approved once</tspan></text>

  <rect x="20" y="156" width="960" height="100" rx="6" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="676" y="178" font-size="14" font-weight="600" fill="currentColor">NEAR only · gateway</text>
  <text x="676" y="198" font-size="14" fill="currentColor" class="muted">attested and pinned;</text>
  <text x="676" y="214" font-size="14" fill="currentColor" class="muted">TLS and the API key end here;</text>
  <text x="676" y="230" font-size="14" fill="currentColor" class="muted">reads images, model id, settings,</text>
  <text x="676" y="246" font-size="14" fill="currentColor" class="muted">headers, sizes, timing</text>

  <rect x="20" y="280" width="960" height="112" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <text x="964" y="300" text-anchor="end" font-size="14" font-weight="600" fill="currentColor">This host</text>

  <!-- 1 · report fetched (unpinned, checked by signatures), verified against the approved build -->
  <line x1="100" y1="90" x2="100" y2="310" stroke="currentColor" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a-head)"/>
  <text x="108" y="112" font-size="14" fill="currentColor">report</text>
  <text x="108" y="128" font-size="14" fill="currentColor" class="muted">fetch unpinned,</text>
  <text x="108" y="144" font-size="14" fill="currentColor" class="muted">checked by signatures</text>
  <rect x="32" y="312" width="136" height="66" rx="5" fill="none" stroke="currentColor" stroke-width="1.4"/>
  <text x="100" y="350" text-anchor="middle" font-size="15" font-weight="600" fill="currentColor">1 Verify build</text>

  <!-- 2 · connection pinned to the report's TLS key before any byte -->
  <line x1="260" y1="312" x2="260" y2="92" stroke="currentColor" stroke-width="1.6" marker-end="url(#a-head)"/>
  <text x="268" y="112" font-size="14" fill="currentColor">headers, API key</text>
  <line x1="252" y1="206" x2="268" y2="206" stroke="currentColor" stroke-width="2"/>
  <text x="274" y="211" font-size="14" fill="currentColor" class="muted">TLS ends (NEAR)</text>
  <rect x="192" y="312" width="136" height="66" rx="5" fill="none" stroke="currentColor" stroke-width="1.4"/>
  <text x="260" y="350" text-anchor="middle" font-size="15" font-weight="600" fill="currentColor">2 Pin TLS key</text>

  <!-- 3 · text encrypted before it leaves -->
  <line x1="420" y1="312" x2="420" y2="92" stroke="currentColor" stroke-width="1.6" marker-end="url(#a-head)"/>
  <text x="428" y="112" font-size="14" fill="currentColor">text as ciphertext</text>
  <rect x="352" y="312" width="136" height="66" rx="5" fill="none" stroke="currentColor" stroke-width="1.4"/>
  <text x="420" y="350" text-anchor="middle" font-size="15" font-weight="600" fill="currentColor">3 Encrypt text</text>

  <!-- 4 · reply; on NEAR the signature is checked before release -->
  <line x1="580" y1="90" x2="580" y2="310" stroke="currentColor" stroke-width="1.6" marker-end="url(#a-head)"/>
  <text x="588" y="112" font-size="14" fill="currentColor">reply</text>
  <text x="588" y="128" font-size="14" fill="currentColor" class="muted">signed on NEAR</text>
  <rect x="512" y="312" width="136" height="66" rx="5" fill="none" stroke="currentColor" stroke-width="1.4"/>
  <text x="580" y="340" text-anchor="middle" font-size="15" font-weight="600" fill="currentColor">4 Check reply</text>
  <text x="580" y="361" text-anchor="middle" font-size="14" fill="currentColor" class="muted">signature · NEAR</text>

  <!-- 4 -> 5 -> 6, on this host -->
  <line x1="648" y1="345" x2="670" y2="345" stroke="currentColor" stroke-width="1.6" marker-end="url(#a-head)"/>
  <line x1="808" y1="345" x2="830" y2="345" stroke="currentColor" stroke-width="1.6" marker-end="url(#a-head)"/>

  <!-- 5 · ledger row on this host -->
  <rect x="672" y="312" width="136" height="66" rx="5" fill="none" stroke="currentColor" stroke-width="1.4"/>
  <text x="740" y="340" text-anchor="middle" font-size="15" font-weight="600" fill="currentColor">5 Ledger row</text>
  <text x="740" y="361" text-anchor="middle" font-size="14" fill="currentColor" class="muted">size, never text</text>

  <!-- 6 · receipt, replayable offline -->
  <rect x="832" y="312" width="136" height="66" rx="5" fill="none" stroke="currentColor" stroke-width="1.4"/>
  <text x="900" y="340" text-anchor="middle" font-size="15" font-weight="600" fill="currentColor">6 Receipt</text>
  <text x="900" y="361" text-anchor="middle" font-size="14" fill="currentColor" class="muted">replay offline</text>
</svg>
